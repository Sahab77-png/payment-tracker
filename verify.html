<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verification Tool</title>
 <link rel="manifest" href="/manifest-verify.json">
<style>
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { margin: 0; background: #f8fafc; color: #1e293b; padding-bottom: 40px; }
  header { background: linear-gradient(135deg, #0f172a, #334155); color: white; padding: 24px; text-align: center; }
  header h1 { margin: 0; font-size: 24px; letter-spacing: 0.5px; }
  header p { margin: 6px 0 0; font-size: 14px; opacity: 0.8; }
  
  main { padding: 16px; max-width: 600px; margin: 0 auto; }
  
  .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 16px; }
  
  .section-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; color: #334155; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; }
  
  .upload-area { border: 2px dashed #cbd5e1; border-radius: 10px; padding: 30px 20px; text-align: center; cursor: pointer; transition: 0.3s; display: block; }
  .upload-area:hover { border-color: #3b82f6; background: #eff6ff; }
  .upload-area input[type="file"] { display: none; }
  .upload-area p { margin: 0; color: #64748b; font-size: 14px; }
  .upload-area span { font-weight: 600; color: #3b82f6; }
  
  label { display: block; font-size: 14px; font-weight: 600; margin: 16px 0 6px; color: #475569; }
  select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; background: #f8fafc; }
  
  .checkbox-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .checkbox-group label { font-weight: 400; display: flex; align-items: center; gap: 6px; margin: 0; font-size: 13px; background: #f1f5f9; padding: 8px; border-radius: 6px; cursor: pointer; }
  
  button.verify-btn { width: 100%; padding: 14px; background: #3b82f6; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 20px; transition: 0.2s; }
  button.verify-btn:hover { background: #2563eb; }
  button.verify-btn:disabled { background: #94a3b8; cursor: not-allowed; }
  
  .loading { display: none; text-align: center; margin-top: 20px; font-weight: 600; color: #3b82f6; }
  
  .result-area { display: none; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 10px; padding: 16px; margin-top: 20px; }
  .result-area.bad { background: #fef2f2; border-color: #fecaca; }
  .result-area h3 { margin: 0 0 8px; color: #166534; font-size: 18px; }
  .result-area.bad h3 { color: #991b1b; }
  .result-area p { margin: 0; font-size: 14px; color: #334155; line-height: 1.5; }
</style>
</head>
<body>

<header>
  <h1>🔍 Verification Tool</h1>
  <p>Simple but profound. Verify information in any format.</p>
</header>

<main>
  <div class="card">
    <div class="section-title">1. Upload File</div>
    <label class="upload-area" for="fileUpload">
      <input type="file" id="fileUpload" accept="image/*, application/pdf, video/*">
      <p>Click to <span>Browse</span> or drag & drop</p>
      <p style="font-size: 12px; margin-top: 8px; color: #94a3b8;">Supports Photo, PDF, Video</p>
    </label>
    <div id="fileName" style="margin-top: 10px; font-size: 13px; color: #3b82f6; font-weight: 600; text-align: center;"></div>

    <div class="section-title" style="margin-top: 24px;">2. Select Category</div>
    <div class="checkbox-group">
      <label><input type="checkbox" value="Information"> Information</label>
      <label><input type="checkbox" value="Misinformation"> Misinformation</label>
      <label><input type="checkbox" value="Disinformation"> Disinformation</label>
      <label><input type="checkbox" value="Knowledge"> Knowledge</label>
    </div>

    <label for="language">3. Set Language</label>
    <select id="language">
      <option value="en">English</option>
      <option value="as">Assamese (অসমীয়া)</option>
      <option value="hi">Hindi (हिन्दी)</option>
      <option value="bn">Bengali (বাংলা)</option>
    </select>

    <button class="verify-btn" id="verifyBtn">Verify Now</button>

    <div class="loading" id="loadingText">🔄 Analyzing content with AI... Please wait.</div>

    <div class="result-area" id="resultBox">
      <h3 id="resultTitle">Verified as: Information</h3>
      <p id="resultDesc">The uploaded content appears to be factual and reliable based on our analysis.</p>
     <p id="resultOrigin"
      style="font-size: 13px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 8px;"> </p>
    </div>
  </div>
</main>

<script>
  const fileInput = document.getElementById('fileUpload');
  const fileNameDisplay = document.getElementById('fileName');
  const verifyBtn = document.getElementById('verifyBtn');
  const loadingText = document.getElementById('loadingText');
  const resultBox = document.getElementById('resultBox');
  const resultTitle = document.getElementById('resultTitle');
  const resultDesc = document.getElementById('resultDesc');

  // ফাইল বাছনি কৰিলে নামটো দেখুওৱা
  fileInput.addEventListener('change', function(e) {
    if (e.target.files.length > 0) {
      fileNameDisplay.textContent = "📎 Selected: " + e.target.files[0].name;
    } else {
      fileNameDisplay.textContent = "";
    }
  });

  // Verify Button Action
  verifyBtn.addEventListener('click', function() {
    if (fileInput.files.length === 0) {
      alert("Please upload a file first.");
      return;
    }

    const file = fileInput.files[0];
    
    // ফাইলৰ ছাইজ চেক কৰা (Gemini API ৰ বাবে ২০ MB তকৈ কম হোৱা ভাল)
    if (file.size > 20 * 1024 * 1024) {
        alert("File is too large. Please upload a file smaller than 20MB.");
        return;
    }

    const reader = new FileReader();

    // লোডিং ষ্টেট দেখুওৱা
    resultBox.style.display = 'none';
    loadingText.style.display = 'block';
    verifyBtn.disabled = true;
    verifyBtn.textContent = "Verifying...";

    reader.onload = async function() {
      // Base64 ডাটা অংশটো বেলেগ কৰা
      const base64Data = reader.result.split(',')[1];
      
      // বাছনি কৰা ভাষা আৰু কেটাগৰি লোৱা
      const selectedLang = document.getElementById('language').value;
      const selectedCategories = Array.from(document.querySelectorAll('.checkbox-group input:checked'))
                                      .map(cb => cb.value).join(', ') || "General Information";

      try {
        // Netlify Serverless Function লৈ ৰিকুৱেষ্ট পঠিওৱা
        const response = await fetch('/.netlify/functions/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            base64Data: base64Data,
            mimeType: file.type,
            language: selectedLang,
            category: selectedCategories
          })
        });

        const result = await response.json();

        if (!response.ok || result.error) {
          throw new Error(result.error || "Failed to get response from server.");
        }

        // ৰিজাল্ট দেখুওৱা
        loadingText.style.display = 'none';
        verifyBtn.disabled = false;
        verifyBtn.textContent = "Verify Now";
        resultBox.style.display = 'block';

        // AI ৰ উত্তৰ অনুসৰি ৰঙ সলনি কৰা
        if (result.status && result.status.toLowerCase().includes("flag")) {
          resultBox.className = "result-area bad";
        } else {
          resultBox.className = "result-area";
        }
        
        resultTitle.textContent = result.title || "Analysis Complete";
        resultDesc.textContent = result.description || "No description provided.";

      } catch (error) {
        loadingText.style.display = 'none';
        verifyBtn.disabled = false;
        verifyBtn.textContent = "Verify Now";
        alert("Error: " + error.message + "\n\nMake sure you have added the GEMINI_API_KEY in Netlify environment variables.");
        console.error(error);
      }
    };

    reader.readAsDataURL(file);
  });
</script>

</body>
</html>
